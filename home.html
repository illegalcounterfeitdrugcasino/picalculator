<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Apple Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Pi Calculator" />
  <link rel="apple-touch-icon" href="icon.png" /> <!-- Optional -->

  <title>Pi Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
    }

    button, input[type="range"] {
      margin: 10px;
      padding: 12px 24px;
      font-size: 1.1em;
      border: none;
      border-radius: 5px;
    }

    button {
      background: #007aff;
      color: white;
    }

    button:hover {
      background: #005bb5;
    }

    .output {
      margin-top: 30px;
      font-size: 1.6em;
    }

    input[type="range"] {
      width: 80%;
    }

    label {
      display: block;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Pi Calculator</h1>
  <div>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>

    <label>
      Speed (iterations/sec): <span id="speedLabel">50000</span><br />
      <input type="range" id="speedSlider" min="1" max="100000000" step="1000" value="50000" />
    </label>
  </div>

  <div class="output">
    <p>π ≈ <span id="piOutput">0</span></p>
    <p>Iterations: <span id="iterations">0</span></p>
  </div>

  <script>
    let running = false;
    let maxSpeed = false;
    let iterations = 0;
    let pi = 0;

    const piOutput = document.getElementById("piOutput");
    const iterOutput = document.getElementById("iterations");
    const speedSlider = document.getElementById("speedSlider");
    const speedLabel = document.getElementById("speedLabel");

    speedSlider.oninput = () => {
      speedLabel.textContent = speedSlider.value;
    };

    document.getElementById("startBtn").onclick = () => {
      if (running) return;
      running = true;
      maxSpeed = false;
      calculatePi();
    };

    document.getElementById("stopBtn").onclick = () => {
      running = false;
      maxSpeed = false;
    };

    document.getElementById("maxBtn").onclick = () => {
      if (running) return;
      running = true;
      maxSpeed = true;
      calculatePi();
    };

    function calculatePi() {
      iterations = 0;
      pi = 0;
      let i = 0;

      const safeLoop = () => {
        if (!running) return;
        const speed = parseInt(speedSlider.value);
        let count = 0;
        const t0 = performance.now();

        while (count < speed && performance.now() - t0 < 1000) {
          pi += 4 * ((i % 2 === 0 ? 1 : -1) / (2 * i + 1));
          i++;
          iterations++;
          count++;
        }

        piOutput.textContent = pi.toFixed(12);
        iterOutput.textContent = iterations;

        setTimeout(safeLoop, 50);
      };

      const maxLoop = () => {
        if (!running) return;
        const t0 = performance.now();
        let count = 0;
        while (performance.now() - t0 < 16) { // hammer hard each frame (~60fps)
          for (let k = 0; k < 1000000; k++, i++) {
            pi += 4 * ((i % 2 === 0 ? 1 : -1) / (2 * i + 1));
            iterations++;
          }
          count++;
        }

        piOutput.textContent = pi.toFixed(12);
        iterOutput.textContent = iterations;
        requestAnimationFrame(maxLoop);
      };

      maxSpeed ? maxLoop() : safeLoop();
    }
  </script>
</body>
</html>
